# Connecteur Granulink — à lancer sur une machine du réseau de la chaudière
# (NAS, Raspberry Pi, PC toujours allumé…)
#
#   1. Renseigner les trois valeurs ci-dessous
#   2. docker compose up -d
#   3. docker compose logs -f   (vérifier « Appairé à l'installation … »)
#
# Après l'appairage, GRANULINK_PAIRING_CODE peut être retiré : le jeton est conservé dans le volume.
services:
  granulink-agent:
    image: ghcr.io/domotrique/granulink-agent:1
    # Pour construire l'image à partir de ce dossier plutôt que la télécharger :
    # build: .
    restart: unless-stopped
    environment:
      GRANULINK_SERVER: "https://app.granulink.fr"   # adresse de Granulink
      BOILER_URL: "http://192.168.1.20"          # adresse de la chaudière sur le réseau local
      GRANULINK_PAIRING_CODE: "XXXX-XXXX"          # code affiché par Granulink
      AGENT_NAME: "NAS salon"                   # nom affiché dans Granulink (facultatif)
      TZ: "Europe/Paris"
    volumes:
      - granulink-agent-data:/data
    # Pour joindre un service du poste lui-même (Granulink ou chaudière virtuelle en local),
    # utiliser l'adresse host.docker.internal :
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  granulink-agent-data:
